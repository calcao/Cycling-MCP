[project]
name = "cycling-mcp"
version = "0.1.0"
description = "Private iGPSPORT CN sync and MCP server"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "mcp>=1.9,<2", "apscheduler>=3.10,<4", "fitdecode>=0.11,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
cycling-sync = "cycling_mcp.cli:main"
cycling-server = "cycling_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cycling_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
